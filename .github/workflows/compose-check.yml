name: Docker Compose Check

on:
  push:
    paths:
      - "tag50/**"
      - "check.sh"
      - ".github/workflows/compose-check.yml"
  pull_request:
    paths:
      - "tag50/**"
      - "check.sh"
      - ".github/workflows/compose-check.yml"

jobs:
  compose-check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Lokale CI-Prüfungen ausführen
        run: ./check.sh
