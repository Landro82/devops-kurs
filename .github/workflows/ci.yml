name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Tests ausführen
        run: ./tests/test.sh

      - name: Docker Image bauen
        run: docker build -t devops-day34 docker/day23
