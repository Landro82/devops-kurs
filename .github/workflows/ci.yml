name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests ausführen
        run: ./tests/test.sh

      - name: Docker Image bauen
        run: docker build -t devops-day34 docker/day23

      - name: Docker Image taggen und pushen
        env:
          IMAGE: ghcr.io/landro82/devops-kurs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker tag devops-day34:latest "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag devops-day34:latest "$IMAGE:day35"
            docker tag devops-day34:latest "$IMAGE:latest"
            docker push "$IMAGE:day35"
            docker push "$IMAGE:latest"
          fi
